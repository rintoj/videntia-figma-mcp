<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Page - Parity Fixtures</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #ffffff;
      padding: 20px;
    }

    /* Single div layout */
    .single-div-container {
      width: 400px;
      height: 300px;
      background-color: #ffffff;
      margin-bottom: 40px;
    }

    .single-div-text {
      position: absolute;
      left: 100px;
      top: 120px;
      width: 200px;
      height: 60px;
      font-size: 24px;
      font-weight: 500;
      line-height: 32px;
      text-align: center;
      color: #333333;
      data-fig-id: "100:2";
    }

    /* Flexbox layout */
    .flex-container {
      display: flex;
      flex-direction: column;
      width: 300px;
      gap: 16px;
      padding: 20px;
      background-color: #ffffff;
      margin-bottom: 40px;
    }

    .flex-item {
      width: 260px;
      height: 80px;
      border-radius: 4px;
    }

    .flex-item-1 {
      background-color: #e5e5e5;
    }

    .flex-item-2 {
      background-color: #d9d9d9;
    }

    /* Grid layout */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 12px;
      width: 324px;
      height: 324px;
      background-color: #ffffff;
      margin-bottom: 40px;
    }

    .grid-cell {
      width: 100px;
      height: 100px;
      border-radius: 4px;
      background-color: #4db3ff;
    }

    /* Text styles for font metric testing */
    .text-element {
      font-size: 16px;
      font-weight: 400;
      font-family: Inter, sans-serif;
      color: #000000;
      line-height: 1.5;
      margin-bottom: 16px;
    }

    .text-element-bold {
      font-size: 20px;
      font-weight: 700;
      color: #000000;
      line-height: 28px;
    }

    .text-element-mismatch {
      font-size: 14px;
      font-weight: 600;
      color: #666666;
    }

    /* Box model testing */
    .box-element {
      width: 150px;
      height: 100px;
      padding: 16px;
      border-radius: 8px;
      background-color: #f0f0f0;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- Single div layout test -->
  <section class="single-div-container" data-fig-id="100:1">
    <div class="single-div-text" data-fig-id="100:2">Hello World</div>
  </section>

  <!-- Flexbox layout test -->
  <section class="flex-container" data-fig-id="200:1">
    <div class="flex-item flex-item-1" data-fig-id="200:2"></div>
    <div class="flex-item flex-item-2" data-fig-id="200:3"></div>
  </section>

  <!-- Grid layout test -->
  <section class="grid-container" data-fig-id="300:1">
    <div class="grid-cell" data-fig-id="300:2"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
    <div class="grid-cell"></div>
  </section>

  <!-- Font metric tests -->
  <section style="margin-top: 40px">
    <p class="text-element" data-fig-id="500:1">Regular text for font testing</p>
    <p class="text-element-bold" data-fig-id="500:2">Bold text element</p>
    <p class="text-element-mismatch" data-fig-id="500:3">Mismatch text</p>
  </section>

  <!-- Box model tests -->
  <div class="box-element" data-fig-id="600:1">Padded box</div>
  <div class="box-element" data-fig-id="600:2" style="color: #ffffff; background-color: #333333">Dark box</div>

  <!-- Position test -->
  <div style="position: absolute; left: 100px; top: 200px; width: 150px; height: 100px; background-color: #e8e8e8"
       data-fig-id="400:1">
    Position test
  </div>

  <!-- Data for JS testing -->
  <script>
    window.__testFixtures = {
      nodeIds: {
        singleDiv: "100:1",
        singleDivText: "100:2",
        flexContainer: "200:1",
        flexItem1: "200:2",
        flexItem2: "200:3",
        gridContainer: "300:1",
        gridCell: "300:2",
        textRegular: "500:1",
        textBold: "500:2",
        textMismatch: "500:3",
        boxPadded: "600:1",
        boxDark: "600:2",
        positionTest: "400:1",
      },
      layouts: {
        singleDiv: "single",
        flexbox: "flex",
        grid: "grid",
      },
    };

    // Wait for fonts to be ready (important for exact rendering)
    document.fonts.ready.then(() => {
      console.log("Fonts ready");
      window.__fontsReady = true;
    });
  </script>
</body>
</html>
